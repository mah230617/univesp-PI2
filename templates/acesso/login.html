{% extends "layout/index.html" %}

{% block content %}
<div>
    <div class="login-header">
        <img src="{{ url_for('static', filename='img/logo.png') }}" class="login-logo" alt="Logo Visual Produções">
    </div>

    {% if erro %}

    <div class="alert alert-danger">{{ erro }}</div>

    {% endif %}

    <form method="POST">
        <div class="col-md-12 mb-3">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-fill"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Usuário"
                    value="{{ username or '' }}" required>
            </div>
        </div>
        <div class="col-md-12 mb-3">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="senha" name="senha" class="form-control border-end-0" placeholder="Senha"
                    required>
                <span class="input-group-text bg-white border-start-0" style="cursor: pointer;"
                    onclick="togglePassword()" required>
                    <i id="eyeIcon" class="bi bi-eye-slash"></i>
                </span>
            </div>
        </div>

        <div class="col-md-12">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Acessar</button>
        </div>
    </form>
</div>

{% endblock %}
